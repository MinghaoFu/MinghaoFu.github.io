<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Minghao — 邮件归档</title>
<style>
 :root{--bg:#faf9f7;--fg:#1a1a19;--dim:#6b6a67;--line:#e5e3df;--accent:#6b5bd6}
 @media(prefers-color-scheme:dark){:root:not([data-theme=light]){
   --bg:#16161a;--fg:#e8e6e3;--dim:#96948f;--line:#2c2c33;--accent:#9b8cf0}}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.65 ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif}
 .wrap{max-width:820px;margin:0 auto;padding:48px 20px 80px}
 h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
 .sub{color:var(--dim);font-size:13px;margin-bottom:32px}
 #gate{max-width:400px}
 input{width:100%;padding:11px 13px;font-size:15px;border:1px solid var(--line);
  border-radius:9px;background:var(--bg);color:var(--fg);font-family:inherit}
 input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
 button{margin-top:10px;padding:11px 20px;font-size:15px;font-weight:530;border:0;
  border-radius:9px;background:var(--accent);color:#fff;cursor:pointer;font-family:inherit}
 button:disabled{opacity:.5;cursor:default}
 #err{color:#c0392b;font-size:13px;min-height:19px;margin-top:9px}
 @media(prefers-color-scheme:dark){#err{color:#ff8b7a}}
 #search{margin:0 0 24px;display:none}
 .mail{border-top:1px solid var(--line);padding:22px 0}
 .mail h2{font-size:16px;font-weight:590;margin:0 0 6px;letter-spacing:-.005em}
 .meta{color:var(--dim);font-size:12.5px;display:flex;gap:10px;flex-wrap:wrap}
 .meta.to{margin-top:2px}
 .from{font-weight:520;color:var(--fg)}
 pre{white-space:pre-wrap;word-wrap:break-word;margin:12px 0 0;font-size:13.5px;
  line-height:1.6;color:var(--dim);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  max-height:300px;overflow:auto;border-left:2px solid var(--line);padding-left:14px}
 .note{border:1px solid var(--line);border-radius:10px;padding:14px 16px;
  font-size:13px;color:var(--dim);margin-bottom:28px}
</style>
<div class="wrap">
 <h1>Minghao — 邮件归档</h1>
 <div class="sub">3 封　·　已排除 2 封认证类邮件（登录链接／验证码／安全告警）</div>
 <div id="gate">
   <div class="note">内容以 AES-256-GCM 加密存放在本页内，需口令解密。没有口令无法从源码中读出任何内容。</div>
   <input id="pw" type="password" placeholder="口令" autocomplete="off" autofocus>
   <button id="go">解锁</button>
   <div id="err"></div>
 </div>
 <input id="search" type="search" placeholder="搜索主题、发件人、正文…">
 <div id="out"></div>
</div>

const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const $=i=>document.getElementById(i);
async function unlock(){
  const pw=$("pw").value; if(!pw)return;
  $("go").disabled=true; $("err").textContent="解密中…";
  try{
    const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey(
      {name:"PBKDF2",salt:b(D.salt),iterations:250000,hash:"SHA-256"},
      km,{name:"AES-GCM",length:256},false,["decrypt"]);
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(D.iv)},key,b(D.ct));
    $("out").innerHTML=new TextDecoder().decode(pt);
    $("gate").style.display="none"; $("search").style.display="block";
    $("search").oninput=e=>{
      const q=e.target.value.toLowerCase();
      document.querySelectorAll(".mail").forEach(m=>{
        m.style.display=!q||m.textContent.toLowerCase().includes(q)?"":"none";});
    };
  }catch(_){ $("err").textContent="口令不对"; $("go").disabled=false; }
}
$("go").onclick=unlock;
$("pw").onkeydown=e=>{if(e.key==="Enter")unlock();};
</script>
