<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>claude.code 共享收件箱</title>
<style>
:root{
 --paper:#fbfcfd; --panel:#f2f5f8; --ink:#14181f; --mute:#5d6b7e; --faint:#8a97a8;
 --rule:#e1e7ee; --accent:#2f5fd8; --live:#0a7f5f; --liveBg:#e6f4ef; --chip:#e8eefc;
 --shadow:0 1px 2px rgba(20,24,31,.05),0 8px 24px -16px rgba(20,24,31,.28);
}
@media(prefers-color-scheme:dark){:root{
 --paper:#0f1216; --panel:#161b21; --ink:#e6e9ee; --mute:#96a3b4; --faint:#6c7a8c;
 --rule:#232a33; --accent:#7ea4ff; --live:#4fd1a5; --liveBg:#122b24; --chip:#1c2740;
 --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -16px rgba(0,0,0,.7);}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
 font:15px/1.55 -apple-system,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
 font-feature-settings:"cv05","ss01";}
code,.mono,.addr,.otp,.when{font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace}

/* ── 顶栏 ── */
header{position:sticky;top:0;z-index:9;background:var(--paper);
 border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:20px;
 padding:13px 24px}
.box{font-weight:600;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.box span{color:var(--faint);font-weight:400}
#q{flex:1;max-width:420px;padding:8px 13px;border:1px solid var(--rule);border-radius:7px;
 background:var(--panel);color:var(--ink);font:inherit;font-size:14px;display:none}
#q:focus{outline:none;border-color:var(--accent);background:var(--paper)}
.n{margin-left:auto;color:var(--faint);font-size:13px;white-space:nowrap}

main{max-width:940px;margin:0 auto;padding:0 24px 72px}

/* ── 口令 ── */
#gate{max-width:360px;margin:14vh auto;text-align:left}
#gate h1{font-size:19px;font-weight:600;margin:0 0 8px;letter-spacing:-.015em}
#gate p{color:var(--mute);font-size:13.5px;line-height:1.6;margin:0 0 20px}
#pw{width:100%;padding:11px 14px;font:inherit;border:1px solid var(--rule);border-radius:8px;
 background:var(--panel);color:var(--ink)}
#pw:focus{outline:none;border-color:var(--accent);background:var(--paper);
 box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
#go{margin-top:12px;padding:10px 22px;font:inherit;font-weight:550;border:0;border-radius:8px;
 background:var(--accent);color:#fff;cursor:pointer}
#go:disabled{opacity:.45;cursor:default}
#err{color:#c0392b;font-size:13px;min-height:19px;margin-top:9px}
@media(prefers-color-scheme:dark){#err{color:#ff8f80}}

/* ── 最新卡片：全页唯一的重点 ── */
.hero{margin:26px 0 34px;padding:22px 24px 24px;border:1px solid var(--rule);
 border-radius:14px;background:var(--panel);box-shadow:var(--shadow)}
.hero.live{border-color:color-mix(in srgb,var(--live) 42%,var(--rule));background:var(--liveBg)}
.hl{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mute);
 font-weight:500;margin-bottom:9px}
.hl time{color:var(--faint);font-weight:400}
.dot{width:7px;height:7px;border-radius:50%;background:var(--live);flex:none}
.hero.live .dot{animation:p 2.4s ease-in-out infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.32}}
@media(prefers-reduced-motion:reduce){.hero.live .dot{animation:none}}
.hero h2{font-size:19px;font-weight:600;line-height:1.35;margin:0 0 5px;letter-spacing:-.017em}
.hfrom{color:var(--mute);font-size:13.5px}
.cta{display:inline-block;margin-top:17px;padding:10px 20px;border:0;border-radius:8px;
 background:var(--live);color:#fff;font:inherit;font-weight:550;font-size:14.5px;
 text-decoration:none;cursor:pointer}
@media(prefers-color-scheme:dark){.cta{color:#08211a}}
.exp{margin-top:11px;font-size:12.5px;color:var(--mute)}
.exp.dead{color:var(--faint)}

/* ── 列表 ── */
.hdr{display:grid;grid-template-columns:30px 148px 1fr 82px;gap:12px;padding:0 12px 8px;
 font-size:11.5px;color:var(--faint);border-bottom:1px solid var(--rule)}
.row{display:grid;grid-template-columns:30px 148px 1fr 82px;gap:12px;align-items:center;
 padding:11px 12px;border-bottom:1px solid var(--rule);cursor:pointer}
.row:hover{background:var(--panel)}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.av{width:26px;height:26px;border-radius:50%;background:var(--chip);color:var(--accent);
 display:grid;place-items:center;font-size:12px;font-weight:600}
.who{font-weight:550;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.s2{color:var(--faint);font-weight:400}
.s2::before{content:" — "}
.when{color:var(--faint);font-size:12px;text-align:right;white-space:nowrap}
.open{display:none;padding:6px 12px 26px 54px;border-bottom:1px solid var(--rule)}
.open.on{display:block}
.oh{font-size:14.5px}
.addr{color:var(--faint);font-size:12.5px}
.ometa{color:var(--faint);font-size:12.5px;margin:3px 0 16px;
 display:flex;gap:14px;flex-wrap:wrap}
.obody{white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.72;color:var(--ink)}
.obody a{color:var(--accent);word-break:break-all}
.otp{background:var(--chip);color:var(--accent);padding:2.5px 9px;border-radius:6px;
 font-size:15px;font-weight:600;letter-spacing:.08em;cursor:pointer;border:0}
@media(max-width:660px){
 header{padding:12px 16px;gap:12px} main{padding:0 16px 60px}
 .hdr{display:none}
 .row{grid-template-columns:26px 1fr 62px;gap:10px}
 .who{display:none} .s2{display:none} .open{padding-left:16px}
}
</style>

const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),$=i=>document.getElementById(i);

/* 时间：24h 内用相对/时刻，今年用月日，更早用年月日；title 给完整时间 */
function stamp(el){
 const d=new Date(el.dataset.ts); if(isNaN(d))return;
 const now=new Date(), diff=(now-d)/1000, sameDay=d.toDateString()===now.toDateString();
 const hm=d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});
 let t;
 if(el.dataset.full) t=d.toLocaleString('zh-CN',{dateStyle:'long',timeStyle:'short'});
 else if(diff<60) t='刚刚';
 else if(diff<3600) t=Math.floor(diff/60)+' 分钟前';
 else if(sameDay) t=hm;
 else if(d.getFullYear()===now.getFullYear()) t=(d.getMonth()+1)+'月'+d.getDate()+'日';
 else t=d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate();
 el.textContent=t;
 el.title=d.toLocaleString('zh-CN',{dateStyle:'full',timeStyle:'medium'});
}
/* 登录链接 10 分钟失效——直接算给用户看 */
function expiry(){
 document.querySelectorAll('.exp[data-exp]').forEach(e=>{
  if(!e.dataset.exp)return;
  const left=600-(Date.now()-new Date(e.dataset.exp))/1000;
  if(left>0){e.textContent='链接有效，剩余 '+Math.floor(left/60)+' 分 '+Math.floor(left%60)+' 秒';e.classList.remove('dead');}
  else{e.textContent='此链接已过期。到 Claude 重新发送一封，然后刷新本页。';e.classList.add('dead');}
 });
}
function tick(){document.querySelectorAll('time[data-ts]').forEach(stamp);expiry();}
function tog(r){r.nextElementSibling.classList.toggle('on');}
async function unlock(){
 const pw=$('pw').value; if(!pw)return;
 $('go').disabled=true; $('err').textContent='解密中…';
 try{
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(D.salt),iterations:250000,hash:'SHA-256'},
    km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(D.iv)},k,b(D.ct));
  $('out').innerHTML=new TextDecoder().decode(pt);
  $('gate').remove(); $('q').style.display='block'; $('n').textContent=N+' 封';
  tick(); setInterval(tick,1000);
  $('q').oninput=e=>{const s=e.target.value.toLowerCase();
   document.querySelectorAll('.row').forEach(r=>{
    const hit=!s||(r.textContent+r.nextElementSibling.textContent).toLowerCase().includes(s);
    r.style.display=hit?'':'none'; if(!hit)r.nextElementSibling.classList.remove('on');});};
  document.addEventListener('click',e=>{
   const c=e.target.closest('.otp'); if(!c)return;
   e.stopPropagation(); navigator.clipboard.writeText(c.dataset.c||c.textContent);
   const o=c.textContent; c.textContent='已复制'; setTimeout(()=>c.textContent=o,900);});
 }catch(_){ $('err').textContent='口令不对'; $('go').disabled=false; $('pw').select(); }
}
$('go').onclick=unlock; $('pw').onkeydown=e=>{if(e.key==='Enter')unlock();};
</script>
