<style>
:root{--bg:#fff;--fg:#202124;--dim:#5f6368;--line:#e8eaed;--hov:#f5f5f5;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
 font:14px/1.5 "Google Sans",Roboto,-apple-system,"Segoe UI",system-ui,sans-serif}
.top{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);
 padding:14px 20px;display:flex;align-items:center;gap:16px;z-index:5}
h1{font-size:17px;font-weight:500;margin:0;white-space:nowrap}
.cnt{color:var(--dim);font-size:13px}
#search{flex:1;max-width:520px;padding:9px 14px;border:1px solid var(--line);
 border-radius:8px;background:var(--hov);color:var(--fg);font:inherit;display:none}

.wrap{max-width:1100px;margin:0 auto}
#gate{max-width:380px;margin:80px auto;padding:0 20px}
#gate p{color:var(--dim);font-size:13px;line-height:1.6}

input[type=password]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
button{margin-top:12px;padding:10px 24px;font:inherit;font-weight:500;border:0;border-radius:8px;
 background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.5}
#err{color:#d93025;font-size:13px;min-height:18px;margin-top:8px}
@media(prefers-color-scheme:dark){#err{color:#f28b82}}
.row{display:grid;grid-template-columns:180px 1fr 110px;gap:14px;padding:11px 20px;
 border-bottom:1px solid var(--line);cursor:pointer;align-items:baseline}
.row:hover{background:var(--hov);box-shadow:inset 1px 0 0 var(--line)}
.c-from{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-subj{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-subj b{font-weight:400}
.snip{color:var(--dim)}
.c-date{color:var(--dim);font-size:12.5px;text-align:right;white-space:nowrap}
.det{display:none;padding:18px 20px 26px;border-bottom:1px solid var(--line);background:var(--hov)}
.det.on{display:block}
.dh{font-size:14px}.dn{font-weight:500}.da{color:var(--dim)}
.dt{color:var(--dim);font-size:12.5px;margin:2px 0 16px}
.db{white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.7}
.db a{color:var(--accent);word-break:break-all}
.otp{background:var(--chip);color:var(--accent);padding:2px 8px;border-radius:5px;
 font:600 15px ui-monospace,SFMono-Regular,Menlo,monospace;cursor:pointer;letter-spacing:.06em}
@media(max-width:700px){.row{grid-template-columns:1fr 76px}.c-from{grid-column:1/-1;
 font-size:12.5px;color:var(--dim)}.snip{display:none}}

  $("out").innerHTML=new TextDecoder().decode(pt);
  $("gate").remove(); $("search").style.display="block";
  $("search").oninput=e=>{const q=e.target.value.toLowerCase();
   document.querySelectorAll(".row").forEach(r=>{
    const hit=!q||(r.textContent+r.nextElementSibling.textContent).toLowerCase().includes(q);
    r.style.display=hit?"":"none"; if(!hit)r.nextElementSibling.classList.remove("on");});};
  document.addEventListener("click",e=>{
   if(e.target.classList.contains("otp")){
     navigator.clipboard.writeText(e.target.textContent);
     const o=e.target.textContent; e.target.textContent="已复制";
     setTimeout(()=>e.target.textContent=o,900); e.stopPropagation();}});
 }catch(_){ $("err").textContent="口令不对"; $("go").disabled=false; }
}
$("go").onclick=unlock; $("pw").onkeydown=e=>{if(e.key==="Enter")unlock();};
</script>
